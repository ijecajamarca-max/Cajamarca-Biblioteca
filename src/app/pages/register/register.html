<div
  class="min-h-screen bg-slate-950
         flex items-center justify-center
         px-4 py-10"
>
  <div class="w-full max-w-md">
    <div class="text-center mb-7">
      <h1
        class="text-3xl
               font-bold
               text-white"
      >
        Crear cuenta
      </h1>
      <p
        class="mt-2
               text-sm
               text-slate-400"
      >
        Regístrate para acceder a la plataforma
      </p>
    </div>
    <!-- TARJETA -->
    <div
      class="rounded-3xl
             bg-white
             p-8
             shadow-2xl"
    >
      <form>
        <!-- NOMBRE -->
        <div class="mb-4">
          <label
            class="block mb-2
                   text-sm
                   font-medium
                   text-slate-700"
          >
            Nombre completo
          </label>
          <input
            type="text"
            placeholder="Ingresa tu nombre"
            class="w-full
                   rounded-xl
                   border border-slate-300
                   px-4 py-3
                   outline-none
                   focus:border-blue-500
                   focus:ring-4
                   focus:ring-blue-100"
          >
        </div>
        <!-- CORREO -->
        <div class="mb-4">
          <label
            class="block mb-2
                   text-sm
                   font-medium
                   text-slate-700"
          >
            Correo electrónico
          </label>
          <input
            type="email"
            placeholder="ejemplo@correo.com"
            class="w-full
                   rounded-xl
                   border border-slate-300
                   px-4 py-3
                   outline-none
                   focus:border-blue-500
                   focus:ring-4
                   focus:ring-blue-100"
          >
        </div>
        <!-- CONTRASEÑA -->
        <div class="mb-4">
          <label
            class="block mb-2
                   text-sm
                   font-medium
                   text-slate-700"
          >
            Contraseña
          </label>
          <input
            type="password"
            placeholder="Ingresa contraseña"
            class="w-full
                   rounded-xl
                   border border-slate-300
                   px-4 py-3
                   outline-none
                   focus:border-blue-500
                   focus:ring-4
                   focus:ring-blue-100"
          >
        </div>
        <!-- CONFIRMAR -->
        <div class="mb-6">
          <label
            class="block mb-2
                   text-sm
                   font-medium
                   text-slate-700"
          >
            Confirmar contraseña
          </label>
          <input
            type="password"
            placeholder="Ingresa Contraseña"
            class="w-full
                   rounded-xl
                   border border-slate-300
                   px-4 py-3
                   outline-none
                   focus:border-blue-500
                   focus:ring-4
                   focus:ring-blue-100"
          >
        </div>
        <!-- BOTÓN -->
        <button
          type="button"
          class="w-full
                 rounded-xl
                 bg-gradient-to-r
                 from-orange-500
                 to-blue-700
                 px-4 py-3
                 font-bold
                 text-white
                 shadow-lg
                 hover:brightness-110
                 transition"
        >
          CREAR CUENTA
        </button>
      </form>
      <!-- VOLVER -->
      <div class="mt-6 text-center">
        <a
          routerLink="/login"
          class="text-sm
                 font-semibold
                 text-blue-600
                 hover:text-blue-700
                 cursor-pointer"
        >
          ← Volver al inicio de sesión
        </a>
      </div>
    </div>
  </div>
</div>
