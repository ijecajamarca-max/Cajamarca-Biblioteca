<div
  class="min-h-screen relative bg-cover bg-center bg-no-repeat flex items-center"
  style="
    background-image:
      linear-gradient(
        90deg,
        rgba(0, 20, 40, 0.35),
        rgba(0, 15, 30, 0.65)
      ),
      url('/fondo.jpg');
  "
>
  <!-- OSCURECIMIENTO GENERAL -->
  <div class="absolute inset-0 bg-black/20"></div>
  <!-- CONTENIDO -->
  <div
    class="relative z-10
           w-full
           max-w-7xl
           mx-auto
           px-6 md:px-12
           py-10
           grid
           grid-cols-1
           lg:grid-cols-2
           gap-10
           items-center"
  >
    <!-- IZQUIERDA -->
    <div
      class="hidden lg:block
             text-white
             max-w-xl"
    >
      <div
        class="mb-8
               w-28 h-28
               rounded-2xl
               bg-white/95
               shadow-2xl
               flex items-center justify-center
               overflow-hidden"
      >
      </div>
      <h1
        class="text-4xl xl:text-5xl
               font-bold
               leading-tight
               drop-shadow-lg"
      >
        Bienvenido a tu
        <span class="text-yellow-400">
          Biblioteca VIRTUAL
        </span>
      </h1>
      <div
        class="mt-8
               rounded-2xl
               bg-black/35
               backdrop-blur-md
               border border-white/20
               p-5
               shadow-xl"
      >
      subtitulo
        <h2
          class="text-yellow-400
                 text-sm
                 font-bold
                 uppercase
                 tracking-wide"
        >
        </h2>
        <p
          class="mt-3
                 text-xs
                 leading-relaxed
                 text-white/80"
        >
        texto
        </p>
      </div>
      <div
        class="mt-4
               rounded-2xl
               bg-black/35
               backdrop-blur-md
               border border-white/20
               p-5
               shadow-xl"
      >
        <h2
          class="text-yellow-400
                 text-sm
                 font-bold
                 uppercase
                 tracking-wide"
        >
          subtitulo
        </h2>
        <p
          class="mt-3
                 text-xs
                 leading-relaxed
                 text-white/80"
        >texto
        </p>
      </div>
    </div>
    <!--DERECHA -->
    <div
      class="w-full
             flex
             justify-center
             lg:justify-end"
    >
      <div
        class="w-full
               max-w-[390px]
               rounded-3xl
               bg-black/55
               backdrop-blur-xl
               border border-white/20
               shadow-2xl
               p-7 md:p-8
               text-white"
      >
        <!-- TITULO -->
        <div class="text-center mb-7">
          <h2
            class="text-2xl
                   font-bold"
          >
            Bienvenido
          </h2>
          <p
            class="mt-2
                   text-xs
                   text-white/60"
          >
            Accede a tu biblioteca digital
          </p>
        </div>
        <!-- FORMULARIO -->
        <form>
          <!-- CORREO -->
          <div class="mb-5">
            <label
              for="email"
              class="block
                     mb-2
                     text-[11px]
                     font-medium
                     text-white/80"
            >
              Correo electronico
            </label>
            <input
              id="email"
              type="email"
              placeholder="ejemplo@correo.com"
              class="w-full
                     h-11
                     rounded-xl
                     border border-white/20
                     bg-white/10
                     px-4
                     text-xs
                     text-white
                     placeholder:text-white/40
                     outline-none
                     transition
                     focus:border-yellow-400
                     focus:ring-2
                     focus:ring-yellow-400/20"
            >
          </div>
          <!-- CONTRASEÑA -->
          <div class="mb-4">
            <label
              for="password"
              class="block
                     mb-2
                     text-[11px]
                     font-medium
                     text-white/80"
            >
              Contraseña
            </label>
            <input
              id="password"
              type="password"
              placeholder="Ingresa CONTRASEÑA"
              class="w-full
                     h-11
                     rounded-xl
                     border border-white/20
                     bg-white/10
                     px-4
                     text-xs
                     text-white
                     placeholder:text-white/40
                     outline-none
                     transition
                     focus:border-yellow-400
                     focus:ring-2
                     focus:ring-yellow-400/20"
            >
          </div>
          <!-- RECORDAR / RECUPERAR -->
          <div
            class="flex
                   items-center
                   justify-between
                   mb-6"
          >
            <label
              class="flex
                     items-center
                     gap-2
                     text-[10px]
                     text-white/60
                     cursor-pointer"
            >
              <input
                type="checkbox"
                class="w-3.5 h-3.5
                       accent-yellow-400"
              >
              Recordarme
            </label>
            <a
              routerLink="/forgot-password"
              class="text-[10px]
                     font-semibold
                     text-yellow-400
                     hover:text-yellow-300
                     transition
                     cursor-pointer"
            >
              ¿Olvidaste tu contraseña?
            </a>
          </div>
          <!-- BOTON LOGIN -->
          <button
            type="button"
            class="w-full
                   h-11
                   rounded-xl
                   bg-gradient-to-r
                   from-orange-500
                   via-orange-500
                   to-blue-700
                   text-white
                   text-xs
                   font-bold
                   tracking-wide
                   shadow-lg
                   hover:brightness-110
                   active:scale-[0.98]
                   transition"
          >
            INICIAR SESION
          </button>
        </form>
        <!-- REGISTRO -->
        <div
          class="mt-6
                 pt-5
                 border-t
                 border-white/10
                 text-center"
        >
          <p
            class="text-[10px]
                   text-white/50"
          >
            ¿No tienes una cuenta?
          </p>
          <a
            routerLink="/register"
            class="inline-block
                   mt-2
                   text-xs
                   font-bold
                   text-blue-400
                   hover:text-blue-300
                   transition
                   cursor-pointer"
          >
            Crear una cuenta
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
