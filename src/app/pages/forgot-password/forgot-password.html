<div
  class="min-h-screen   bg-slate-950  flex items-center  justify-center  px-4"
>
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1
        class="text-3xl   font-bold text-white"
      >
        Recuperar cuenta
      </h1>
      <p
        class="mt-2 text-sm  text-slate-400"
      >
        Recupera el acceso a tu cuenta
      </p>
    </div>
    <div
      class="rounded-3xl  bg-white  p-8 shadow-2xl"
    >
      @if (error) {
        <div
          class="mb-5 rounded-xl  bg-red-50 border border-red-200 px-4 py-3 text-sm  text-red-600"
        >
          {{ error }}
        </div>
      }
      @if (mensaje) {
        <div
          class="mb-5  rounded-xl  bg-green-50  border border-green-200  px-4 py-3  text-sm  text-green-600"
        >
          {{ mensaje }}
        </div>
      }
      @if (!usuarioEncontrado) {
        <div>
          <p
            class="mb-6   text-sm   leading-relaxed text-slate-600"
          >
            Introduce tu correo electronico.
          </p>
          <div class="mb-6">
            <label
              for="correo"
              class="block  mb-2  text-sm font-medium text-slate-700"
            >
              Correo electronico
            </label>
            <input
              id="correo"
              type="email"
              [(ngModel)]="correo"
              name="correo"
              placeholder="ejemplo@correo.com"
              class="w-full   rounded-xl  border border-slate-300  px-4 py-3  text-slate-900  outline-none  focus:border-blue-500
                     focus:ring-4  focus:ring-blue-100"
            >
          </div>
          <button
            type="button"
            (click)="buscarCuenta()"
            class="w-full rounded-xl  bg-gradient-to-r  from-orange-500 to-blue-700 px-4 py-3 font-bold text-white  shadow-lg
                   hover:brightness-110 transition"
          >
            BUSCAR CUENTA
          </button>
        </div>
      }
      @if (usuarioEncontrado) {
        <div>
          <div class="mb-5">
            <label
              for="nuevaPassword"
              class="block  mb-2   text-sm  font-medium  text-slate-700"
            >
              Nueva contraseña
            </label>
            <input
              id="nuevaPassword"
              type="password"
              [(ngModel)]="nuevaPassword"
              name="nuevaPassword"
              placeholder="ingresa contraseña"
              class="w-full  rounded-xl  border  border-slate-300  px-4 py-3  text-slate-900  outline-none  focus:border-blue-500
                     focus:ring-4  focus:ring-blue-100"
            >

          </div>
          <div class="mb-6">
            <label
              for="confirmarPassword"
              class="block  mb-2  text-sm font-medium text-slate-700"
            >
              Confirmar contraseña
            </label>
            <input
              id="confirmarPassword"
              type="password"
              [(ngModel)]="confirmarPassword"
              name="confirmarPassword"
              placeholder="ingresa contraseña"
              class="w-full  rounded-xl  border border-slate-300  px-4 py-3  text-slate-900  outline-none  focus:border-blue-500
                     focus:ring-4  focus:ring-blue-100"
            >
          </div>
          <button
            type="button"
            (click)="cambiarPassword()"
            class="w-full  rounded-xl  bg-gradient-to-r  from-orange-500  to-blue-700  px-4 py-3  font-bold  text-white
                   shadow-lg  hover:brightness-110  transition"
          >
            CAMBIAR CONTRASEÑA
          </button>
        </div>
      }
      <div
        class="mt-6 pt-5  border-t  border-slate-200  text-center"
      >
        <a
          routerLink="/login"
          class="text-sm  font-semibold  text-blue-600 hover:text-blue-700   cursor-pointer"
        >
        Volver al inicio de sesion
        </a>
      </div>
    </div>
  </div>
</div>
